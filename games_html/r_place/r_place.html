<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>r/place</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            user-select: none;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            background-color: #252526;
            border: 1px solid #3c3c3c;
            padding: 12px 20px;
            border-radius: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .canvas-container {
            width: 800px;
            height: 600px;
            border: 1px solid #3c3c3c;
            background-color: #111111;
            border-radius: 8px;
            overflow: auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            cursor: crosshair;
            transform-origin: top left;
        }
        .palette-area {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            background-color: #252526;
            border: 1px solid #3c3c3c;
            padding: 12px 20px;
            border-radius: 8px;
        }
        #color-picker {
            width: 45px;
            height: 45px;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            background: none;
            cursor: pointer;
        }
        #color-picker:disabled {
            cursor: not-allowed;
            opacity: 0.3;
        }
        #cooldown {
            font-weight: bold;
            color: #f48771;
            min-width: 90px;
        }
        button, select {
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #3c3c3c;
            background-color: #2d2d2d;
            color: #ffffff;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            transition: background-color 0.2s, border-color 0.2s;
        }
        button:hover:not(:disabled), select:hover {
            background-color: #3e3e3e;
            border-color: #4fc1ff;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .view-mode-indicator {
            color: #f48771;
            font-weight: bold;
            display: none;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .instructions {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #777777;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>r/place</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="archive-select">📂 Archive:</label>
            <select id="archive-select">
                <option value="live">-- Current Live Canvas --</option>
            </select>
        </div>
        
        <div id="cooldown">Ready!</div>
        
        <div class="control-group">
            <button id="zoom-in">🔍 Zoom In</button>
            <button id="zoom-out">🔍 Zoom Out</button>
            <button id="reset-cam">🔄 Reset View</button>
        </div>

        <button id="download-btn">📥 Download PNG</button>
        
        <span id="view-indicator" class="view-mode-indicator">⚠️ ARCHIVE VIEW (Read-Only)</span>
    </div>

    <div class="canvas-container">
        <canvas id="placeCanvas" width="1024" height="1024"></canvas>
    </div>

    <div class="palette-area">
        <label for="color-picker" style="font-weight: bold;">Choose Color:</label>
        <input type="color" id="color-picker" value="#ffffff">
    </div>
    
    <div class="instructions">
        Use the Zoom buttons to scale the canvas. Native scrollbars will appear automatically to let you navigate.
    </div>

    <script>
        const canvas = document.getElementById('placeCanvas');
        const ctx = canvas.getContext('2d');
        const archiveSelect = document.getElementById('archive-select');
        const viewIndicator = document.getElementById('view-indicator');
        const cooldownDisplay = document.getElementById('cooldown');
        const colorPicker = document.getElementById('color-picker');
        const downloadBtn = document.getElementById('download-btn');
        
        const btnZoomIn = document.getElementById('zoom-in');
        const btnZoomOut = document.getElementById('zoom-out');
        const btnReset = document.getElementById('reset-cam');

        const CANVAS_SIZE = 1024;
        const COOLDOWN_TIME = 5 * 60 * 1000;
        
        let zoomLevels = [0.5, 0.75, 1, 1.5, 2, 3, 4, 6, 8, 12, 16];
        let currentZoomIndex = 2;

        function loadLiveCanvas() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            const savedData = localStorage.getItem('place_live_image_1024');
            if (savedData) {
                const img = new Image();
                img.onload = () => { ctx.drawImage(img, 0, 0); };
                img.src = savedData;
            }
            updateZoom();
        }

        function updateZoom() {
            const factor = zoomLevels[currentZoomIndex];
            canvas.style.width = (CANVAS_SIZE * factor) + 'px';
            canvas.style.height = (CANVAS_SIZE * factor) + 'px';
        }

        function fetchArchiveList() {
            fetch('save_backup.php')
            .then(res => res.json())
            .then(backups => {
                archiveSelect.innerHTML = '<option value="live">-- Current Live Canvas --</option>';
                backups.forEach(backup => {
                    const option = document.createElement('option');
                    option.value = backup.url;
                    option.textContent = `Snapshot: ${backup.month}`;
                    archiveSelect.appendChild(option);
                });
            })
            .catch(err => console.error("Error loading archive:", err));
        }

        function checkMonthlyBackup() {
            const now = new Date();
            const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const lastCheckedMonth = localStorage.getItem('place_last_month_checked_1024');

            if (lastCheckedMonth && lastCheckedMonth !== currentMonthStr) {
                fetch('save_backup.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: canvas.toDataURL(),
                        month: lastCheckedMonth
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') fetchArchiveList();
                });
            }
            localStorage.setItem('place_last_month_checked_1024', currentMonthStr);
        }

        archiveSelect.addEventListener('change', (e) => {
            const path = e.target.value;
            if (path === 'live') {
                loadLiveCanvas();
                viewIndicator.style.display = 'none';
                colorPicker.disabled = false;
            } else {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = path;
                viewIndicator.style.display = 'inline';
                colorPicker.disabled = true;
            }
        });

        function checkCooldown() {
            const lastPlacement = localStorage.getItem('place_last_placement_time_1024');
            if (!lastPlacement) return true;

            const elapsed = Date.now() - parseInt(lastPlacement);
            if (elapsed < COOLDOWN_TIME) {
                startCooldownTimer(COOLDOWN_TIME - elapsed);
                return false;
            }
            return true;
        }

        function startCooldownTimer(duration) {
            let remaining = Math.ceil(duration / 1000);
            
            function formatTime(secs) {
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return `Wait: ${m}:${s.toString().padStart(2, '0')}`;
            }

            cooldownDisplay.textContent = formatTime(remaining);
            
            const interval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(interval);
                    cooldownDisplay.textContent = "Ready!";
                } else {
                    cooldownDisplay.textContent = formatTime(remaining);
                }
            }, 1000);
        }

        canvas.addEventListener('click', (e) => {
            if (archiveSelect.value !== 'live') return;
            if (!checkCooldown()) return; 

            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_SIZE / rect.width;
            const scaleY = CANVAS_SIZE / rect.height;

            const pixelX = Math.floor((e.clientX - rect.left) * scaleX);
            const pixelY = Math.floor((e.clientY - rect.top) * scaleY);

            if (pixelX >= 0 && pixelX < CANVAS_SIZE && pixelY >= 0 && pixelY < CANVAS_SIZE) {
                ctx.fillStyle = colorPicker.value;
                ctx.fillRect(pixelX, pixelY, 1, 1);
                
                localStorage.setItem('place_live_image_1024', canvas.toDataURL());
                localStorage.setItem('place_last_placement_time_1024', Date.now().toString());
                startCooldownTimer(COOLDOWN_TIME);
            }
        });

        downloadBtn.addEventListener('click', () => {
            const currentSelection = archiveSelect.value;
            let filename = 'r-place-live.png';
            if (currentSelection !== 'live') {
                filename = currentSelection.split('/').pop();
            }
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL();
            link.click();
        });

        btnZoomIn.addEventListener('click', () => {
            if (currentZoomIndex < zoomLevels.length - 1) {
                currentZoomIndex++;
                updateZoom();
            }
        });

        btnZoomOut.addEventListener('click', () => {
            if (currentZoomIndex > 0) {
                currentZoomIndex--;
                updateZoom();
            }
        });

        btnReset.addEventListener('click', () => {
            currentZoomIndex = 2;
            updateZoom();
        });

        loadLiveCanvas();
        fetchArchiveList();
        checkMonthlyBackup();
        checkCooldown();
    </script>
</body>
</html>
