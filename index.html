<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Games</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 40px;
        }
        h1 {
            color: #ffffff;
            border-bottom: 1px solid #3c3c3c;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        /* Grid-Layout für die Kacheln */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        /* Style für eine einzelne Kachel */
        .game-card {
            background-color: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            border-color: #4fc1ff;
        }
        /* Das Bild oben in der Kachel */
        .game-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #111;
        }
        /* Textbereich innerhalb der Kachel */
        .game-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        /* Erste Zeile aus game.txt */
        .game-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            margin: 0;
        }
        /* Zweite Zeile aus game.txt */
        .game-description {
            font-size: 0.95rem;
            color: #aaaaaa;
            margin: 0;
            line-height: 1.4;
        }
        .error-message {
            color: #f44336;
            background: #2d1919;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #5a2323;
        }
    </style>
</head>
<body>

    <h1>My Games</h1>
    
    <!-- Hier fügt JavaScript die Kacheln automatisch ein -->
    <div id="games-container" class="games-grid"></div>

    <script>
        const container = document.getElementById('games-container');

        // Funktion, um die game.txt für ein einzelnes Spiel zu laden und die Kachel zu bauen
        async function erstelleKachel(game) {
            let titel = game.name; 
            let beschreibung = "Keine Beschreibung verfügbar.";

            const pfadZuDateien = `games/${game.name}`;
            const zielHtmlPfad = `${game.name}.html`;
            
            // Das Bild wird hier nun fest als "picture.png" definiert
            const bildPfad = `${pfadZuDateien}/picture.png`;

            try {
                // Lädt die game.txt Datei im Hintergrund
                const response = await fetch(`${pfadZuDateien}/game.txt`);
                if (response.ok) {
                    const text = await response.text();
                    const zeilen = text.split('\n');
                    
                    if (zeilen[0] && zeilen[0].trim() !== "") {
                        titel = zeilen[0].trim();
                    }
                    if (zeilen[1] && zeilen[1].trim() !== "") {
                        beschreibung = zeilen[1].trim();
                    }
                }
            } catch (error) {
                beschreibung = "Fehler beim Laden der Spieldaten.";
            }

            // Kachel-Link erstellen
            const kachel = document.createElement('a');
            kachel.className = 'game-card';
            kachel.href = zielHtmlPfad;

            // HTML-Struktur der Kachel zusammenbauen
            kachel.innerHTML = `
                <img class="game-image" src="${bildPfad}" alt="${titel}" onerror="this.style.display='none'">
                <div class="game-info">
                    <h2 class="game-title">${titel}</h2>
                    <p class="game-description">${beschreibung}</p>
                </div>
            `;

            container.appendChild(kachel);
        }

        // Hauptfunktion: Lädt zuerst die JSON-Datei
        async function ladeSpieleBibliothek() {
            try {
                const response = await fetch('games.json');
                if (!response.ok) {
                    throw new Error('games.json konnte nicht geladen werden.');
                }
                
                const spieleListe = await response.json();
                
                // Gehe jedes Spiel aus der JSON durch und erstelle die Kachel
                spieleListe.forEach(game => erstelleKachel(game));
                
            } catch (error) {
                container.innerHTML = `
                    <div class="error-message">
                        <strong>Fehler beim Laden der Spieleliste!</strong><br>
                        Stelle sicher, dass der VS Code Live Server aktiv ist und die Datei 'games.json' existiert.
                    </div>
                `;
                console.error(error);
            }
        }

        // Starte das Skript beim Laden der Seite
        ladeSpieleBibliothek();
    </script>
</body>
</html>
